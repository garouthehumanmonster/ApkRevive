[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkrevive"
version = "3.3.0"
description = "Legacy Android APK modernizer pipeline targeting API 3-28 (Alpha)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
apkrevive = "apkrevive.cli:main"

[tool.setuptools.packages.find]
include = ["apkrevive*"]

[tool.setuptools.package-data]
"apkrevive.shim" = ["*.dex", "*.java"]
