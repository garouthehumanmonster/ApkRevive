[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkrevive"
version = "0.5.0a1"
description = "Legacy Android APK modernizer pipeline targeting API 3-28 (Alpha)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "coverage>=7.0.0",
]

[project.scripts]
apkrevive = "apkrevive.cli:main"

[tool.setuptools.packages.find]
include = ["apkrevive*"]

[tool.setuptools.package-data]
"apkrevive.shim" = ["*.dex", "*.java"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "canaries",
    "apkrevive-android",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E402"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.coverage.run]
source = ["apkrevive"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
pythonpath = ["."]
