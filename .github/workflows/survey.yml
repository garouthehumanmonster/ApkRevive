name: Android Compatibility Survey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    name: Survey API ${{ matrix.api-level }} (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: default
            arch: x86_64
            profile: pixel_6
          - api-level: 35
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - api-level: 35
            target: google_apis_ps16k
            arch: x86_64
            profile: pixel_6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis rich
          pip install -e .

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Set up Android SDK and System Image
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools emulator build-tools;35.0.0 system-images;android-${{ matrix.api-level }};${{ matrix.target }};${{ matrix.arch }}"

      - name: Run Survey in Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio
          script: bash scripts/ci_survey.sh

      - name: Upload Survey Results and Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-results-api${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            results/**/*.json
            receipts/*.json
            build/survey_runs/**/*.png
