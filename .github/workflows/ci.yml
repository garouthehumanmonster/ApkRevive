name: CI & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy coverage pytest hypothesis rich
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy apkrevive --ignore-missing-imports

      - name: Test suite with coverage and Hypothesis fuzzing
        run: |
          coverage run -m pytest tests/
          coverage report --fail-under=80

  android-ci:
    name: Android Companion App CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build, Lint & Test Android Companion
        run: |
          chmod +x apkrevive-android/gradlew
          cd apkrevive-android
          ./gradlew test lintDebug assembleDebug assembleRelease --no-daemon

      - name: Stage Companion APKs
        run: |
          mkdir -p dist-companion
          cp apkrevive-android/app/build/outputs/apk/release/app-release.apk dist-companion/ApkRevive-Companion-v0.5.0.apk
          cp apkrevive-android/app/build/outputs/apk/debug/app-debug.apk dist-companion/ApkRevive-Companion-v0.5.0-debug.apk

      - name: Upload Companion APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apkrevive-android-companion
          path: dist-companion/*.apk
          if-no-files-found: error

  canary-matrix-and-sarif:
    name: Multi-Tier Canary Matrix & SARIF Telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis rich
          pip install -e .

      - name: Build Canaries
        run: python canaries/build_canaries.py

      - name: Run Multi-Tier Canary Matrix (4 Tiers)
        run: |
          python scripts/verify_canary_matrix.py --simulate --tier all --write-results --update-docs

      - name: Generate SARIF Telemetry Reports
        run: |
          mkdir -p sarif-reports
          apkrevive triage canaries/build/canary_install_floor_failing.apk --sarif > sarif-reports/canary_install_floor.sarif || true
          apkrevive triage canaries/build/canary_page_size_failing.apk --device-api 35 --page-size 16384 --sarif > sarif-reports/canary_page_size_16k.sarif || true
          apkrevive diff canaries/build/canary_page_size_failing.apk canaries/build/canary_page_size_control.apk --sarif > sarif-reports/diff_page_size.sarif || true

      - name: Upload SARIF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sarif-diagnostics
          path: sarif-reports/*.sarif

      - name: Upload Canary Verification Receipts
        uses: actions/upload-artifact@v4
        with:
          name: canary-matrix-receipts
          path: results/*.json

  android-16kb-emulator:
    name: Android 15 (API 35) 16KB Page-Size Emulator
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/16kb-test'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis rich
          pip install -e .

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Set up Android SDK and 16KB System Image
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-35;google_apis_ps16k;x86_64"

      - name: Boot Android 15 16KB Emulator & Verify Page Size
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio
          script: |
            PAGE_SIZE=$(adb shell getconf PAGE_SIZE | tr -d '\r')
            echo "Confirmed Device Kernel PAGE_SIZE: $PAGE_SIZE"
            if [ "$PAGE_SIZE" != "16384" ]; then
              echo "Error: Device PAGE_SIZE is $PAGE_SIZE, expected 16384."
              exit 1
            fi
            apkrevive doctor --device
            python scripts/verify_canary_matrix.py --device --tier 35 --write-results

      - name: Upload 16KB Live Verification Receipts
        uses: actions/upload-artifact@v4
        with:
          name: emulator-16kb-receipts
          path: results/*35*.json
          if-no-files-found: ignore

  release:
    name: Publish Release & PyPI Distribution
    needs: [python-ci, android-ci, canary-matrix-and-sarif]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Source & Binary Wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Download Companion APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apkrevive-android-companion
          path: dist/companion/

      - name: Download SARIF Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sarif-diagnostics
          path: dist/sarif/

      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/companion/*.apk
            dist/sarif/*
          generate_release_notes: true
