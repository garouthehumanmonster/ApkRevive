name: CI & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy coverage pytest hypothesis rich
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy apkrevive --ignore-missing-imports

      - name: Security Audit Dependencies with pip-audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade pip-audit "urllib3>=2.8.0"
          pip-audit .

      - name: Cache F-Droid Corpus APKs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/corpus/apks
          key: corpus-${{ hashFiles('tests/corpus/corpus.json') }}

      - name: Download & Verify Corpus APKs
        run: python scripts/download_corpus.py

      - name: Build Canary Test Suite
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        run: python canaries/build_canaries.py

      - name: Test suite with coverage and Hypothesis fuzzing
        env:
          APKREVIVE_REQUIRE_ARTIFACTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: |
          coverage run -m pytest tests/ -rs
          coverage report --fail-under=80

  android-ci:
    name: Android Companion App CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Decode Release Keystore (if secret present)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > apkrevive-android/release.keystore
            echo "RELEASE_KEYSTORE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_KEYSTORE_EXISTS=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not configured. Release APK will be signed with debug keystore."
          fi

      - name: Build, Lint & Test Android Companion
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x apkrevive-android/gradlew
          cd apkrevive-android
          ./gradlew test lintDebug assembleDebug assembleRelease --no-daemon

      - name: Stage Companion APKs
        run: |
          mkdir -p dist-companion
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
            VERSION_NAME="v${RAW_VER}"
          else
            GRADLE_VER=$(grep 'versionName =' apkrevive-android/app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION_NAME="v${GRADLE_VER}"
          fi
          echo "Derived Companion APK Version Name: ${VERSION_NAME}"
          if [ "$RELEASE_KEYSTORE_EXISTS" = "true" ]; then
            cp apkrevive-android/app/build/outputs/apk/release/app-release.apk dist-companion/ApkRevive-Companion-${VERSION_NAME}.apk
          else
            echo "::warning::Naming release APK with -debug-signed suffix because release keystore was absent."
            cp apkrevive-android/app/build/outputs/apk/release/app-release.apk dist-companion/ApkRevive-Companion-${VERSION_NAME}-debug-signed.apk
          fi
          cp apkrevive-android/app/build/outputs/apk/debug/app-debug.apk dist-companion/ApkRevive-Companion-${VERSION_NAME}-debug.apk

      - name: Upload Companion APK Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apkrevive-android-companion
          path: dist-companion/*.apk
          if-no-files-found: error

  canary-matrix-and-sarif:
    name: Multi-Tier Canary Matrix & SARIF Telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis rich
          pip install -e .

      - name: Build Canaries
        run: python canaries/build_canaries.py

      - name: Run Multi-Tier Canary Matrix (4 Tiers)
        run: |
          python scripts/verify_canary_matrix.py --simulate --tier all --write-results --update-docs

      - name: Generate SARIF Telemetry Reports
        run: |
          mkdir -p sarif-reports
          apkrevive triage canaries/build/canary_install_floor_failing.apk --sarif > sarif-reports/canary_install_floor.sarif || true
          apkrevive triage canaries/build/canary_page_size_failing.apk --device-api 35 --page-size 16384 --sarif > sarif-reports/canary_page_size_16k.sarif || true
          apkrevive diff canaries/build/canary_page_size_failing.apk canaries/build/canary_page_size_control.apk --sarif > sarif-reports/diff_page_size.sarif || true

      - name: Upload SARIF Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-diagnostics
          path: sarif-reports/*.sarif

      - name: Upload Canary Verification Receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-matrix-receipts
          path: results/*.json

  android-16kb-emulator:
    name: Android 15 (API 35) 16KB Page-Size Emulator
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis rich
          pip install -e .

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Set up Android SDK and 16KB System Image
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools emulator build-tools;35.0.0 system-images;android-35;google_apis_ps16k;x86_64"

      - name: Build Canaries
        run: |
          python canaries/build_canaries.py

      - name: Boot Android 15 16KB Emulator & Verify Page Size
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio
          script: bash scripts/ci_16kb.sh

      - name: Report 16KB Emulator Job Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Android 15 (API 35) 16KB Emulator Verification: PASSED :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "Confirmed kernel page size 16384 bytes, doctor diagnostics passed, canary matrix tier 35 passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android 15 (API 35) 16KB Emulator Verification: FAILED :warning:" >> "$GITHUB_STEP_SUMMARY"
            echo "Warning: API 35 16KB emulator verification failed or timed out. Check job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload 16KB Live Verification Receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-16kb-receipts
          path: results/*35*.json
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [python-ci, android-ci, canary-matrix-and-sarif]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      is_prerelease: ${{ steps.tag_check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Inspect Release Tag
        id: tag_check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          # PEP 440 prerelease regex: e.g. v0.5.0a1, v1.0.0b2, v2.1.0rc3
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected PEP 440 pre-release tag: $TAG"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable release tag: $TAG"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build Source & Binary Wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir pydist/

      - name: Download Companion APK Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apkrevive-android-companion
          path: dist/companion/

      - name: Download SARIF Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sarif-diagnostics
          path: dist/sarif/

      - name: Attest Python Distribution Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "pydist/*"

      - name: Attest Companion APK Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/companion/*.apk"

      - name: Upload Wheels for PyPI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-packages
          path: pydist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            pydist/*.whl
            pydist/*.tar.gz
            dist/companion/*.apk
            dist/sarif/*
          generate_release_notes: true
          prerelease: ${{ steps.tag_check.outputs.is_prerelease == 'true' }}

  pypi-publish:
    name: Publish PyPI Distribution
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Built Wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist-packages
          path: pydist/

      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          packages-dir: pydist/
          skip-existing: true
